[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mmrag-production"
version = "0.1.0"
description = "Production-oriented multimodal RAG with hybrid retrieval, reranking, grounding, citations, and evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "numpy>=1.26",
  "pymupdf>=1.24",
  "beautifulsoup4>=4.12",
  "Pillow>=10.4",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "typer>=0.12",
  "rich>=13.9",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
ingest = [
  "pymupdf>=1.24",
  "beautifulsoup4>=4.12",
  "Pillow>=10.4",
]
index = [
  "numpy>=1.26",
  "qdrant-client>=1.12",
]
ml = [
  "sentence-transformers>=3.0",
  "rank-bm25>=0.2",
]
vision = ["open-clip-torch>=2.26"]
providers = ["openai>=1.50", "anthropic>=0.40"]
api = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "typer>=0.12",
  "rich>=13.9",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]
eval = ["ragas>=0.2", "datasets>=3.0"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.12",
]

[project.scripts]
mmrag = "mmrag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["mmrag"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"mmrag/api/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
packages = ["mmrag"]
